<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Hub — Class IX–XII</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>

<div class="toolbar">
 <div class="print-options">
  <div class="sel-group">
   <span class="sel-label">
    Class:
   </span>
   <span class="btn-row" id="classBtns">
   </span>
  </div>
  <div class="sel-group">
   <span class="sel-label">
    Subject:
   </span>
   <span class="btn-row" id="subjBtns">
   </span>
  </div>
  <label class="opt-checkbox compact-opt">
   <input id="compactToggle" type="checkbox"/>
   <span>
    ⚡ Compact Mode
   </span>
  </label>
  <div class="sel-group">
   <span class="sel-label">
    Modules:
   </span>
   <button class="mini-link" id="modAll" type="button">
    All
   </button>
   <button class="mini-link" id="modNone" type="button">
    None
   </button>
   <span class="btn-row" id="moduleList">
   </span>
  </div>
  <span class="toolbar-hint" id="toolbarHint">
  </span>
 </div>
 <button class="print-btn" id="printBtn">
  🖨️ Download as PDF
 </button>
</div>

<div class="notebook-page">

<div class="cover-header">
 <h1 id="coverTitle">
  Class IX
 </h1>
 <div class="cover-sub" id="coverSub">
  Automotive Service Technician — Session Notes
 </div>
</div>

<!-- {{BOOKS}} -->

</div>

<script src="ui/app.js"></script>
</body>
</html>
